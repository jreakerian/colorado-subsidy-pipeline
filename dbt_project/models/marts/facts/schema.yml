version: 2

models:
  - name: fct_crimes
    description: "Core crime incident fact table. Granularity: 1 row per incident (1997-2020). All 16 KPIs aggregate from this table via dimension joins."
    config:
      tags: ['marts', 'fact']
    columns:
      - name: date_key
        tests: [not_null]
        description: "FK to dim_date"
      - name: geo_key
        tests: [not_null]
        description: "FK to dim_geography"
      - name: offense_key
        tests: [not_null]
        description: "FK to dim_offense"
      - name: agency_key
        description: "FK to dim_agency (nullable for unmatched agencies)"
      - name: incident_date
        tests: [not_null]
      - name: time_of_day
        tests:
          - not_null
          - accepted_values:
              values: ['day', 'night']
      - name: crime_count
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 1

  - name: fct_income_population
    description: "Annual county income and population snapshot fact. Granularity: 1 row per county per year (1997-2020)."
    config:
      tags: ['marts', 'fact']
    columns:
      - name: geo_key
        tests: [not_null]
        description: "FK to dim_geography (county-level rows only)"
      - name: year
        tests: [not_null]
      - name: total_population
        tests: [not_null]

  - name: fct_business_subsidy_tiers
    description: "B.A.S.E. program core output. One row per eligible business with composite subsidy tier. This is the central deliverable of the B.A.S.E. program."
    config:
      tags: ['marts', 'fact', 'base_program']
    columns:
      - name: business_key
        tests: [not_null, unique]
        description: "FK to dim_business"
      - name: entity_id
        tests: [not_null, unique]
      - name: composite_tier
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 4
      - name: qualifies_for_subsidy
        tests: [not_null]
      - name: subsidy_tier_label
        tests: [not_null]
      - name: notification_eligible
        tests: [not_null]
