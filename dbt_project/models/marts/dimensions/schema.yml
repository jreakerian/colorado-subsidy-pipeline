version: 2

models:
  - name: dim_date
    description: "Date dimension spanning 1997-2020. "
    config:
      tags: ['marts', 'dimension']
    columns:
      - name: date_key
        tests: [not_null, unique]
        description: "Integer surrogate key in MMDDYYYY format"
      - name: full_date
        tests: [not_null, unique]
      - name: year
        tests: [not_null]
      - name: month
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 12
      - name: day_of_week
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 7
      - name: season
        tests:
          - not_null
          - accepted_values:
              values: ['winter', 'spring', 'summer', 'fall']

  - name: dim_geography
    description: "Conformed geography dimension. One row per city+county or county-only entry. Provides surrogate keys for all geo joins."
    config:
      tags: ['marts', 'dimension']
    columns:
      - name: geo_key
        tests: [not_null, unique]
      - name: city_name
        tests: [not_null]
        description: "City name or '[County Level]' for county-only rows"
      - name: county_name
        tests: [not_null]
      - name: state
        tests:
          - not_null
          - accepted_values:
              values: ['Colorado']

  - name: dim_offense
    description: "Offense dimension. One row per unique offense category + crime_against combination."
    config:
      tags: ['marts', 'dimension']
    columns:
      - name: offense_key
        tests: [not_null, unique]
      - name: offense_category_name
        tests: [not_null]
      - name: crime_against
        tests:
          - not_null
          - accepted_values:
              values: ['Property', 'Person', 'Society']

  - name: dim_agency
    description: "Police agency dimension. Normalized agency names with their primary county."
    config:
      tags: ['marts', 'dimension']
    columns:
      - name: agency_key
        tests: [not_null, unique]
      - name: agency_name
        tests: [not_null, unique]
      - name: primary_county
        tests: [not_null]

  - name: dim_business
    description: "Colorado business entity dimension. Active businesses in good standing. Core for B.A.S.E. subsidy eligibility."
    config:
      tags: ['marts', 'dimension']
    columns:
      - name: business_key
        tests: [not_null, unique]
      - name: entity_id
        tests: [not_null, unique]
      - name: entity_name
        tests: [not_null]
      - name: entity_status
        tests: [not_null]
      - name: is_active
        tests: [not_null]
