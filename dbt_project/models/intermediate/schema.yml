version: 2

models:

  # ── Core Unified Models ───────────────────────────────────────────────────
  # These are the primary input models for the mart layer (dimensions & facts).

  - name: int_crimes_unified
    description: >
      Unified, normalized crime incidents from 1997–2020. Single source of truth
      for fct_crimes, dim_offense, and dim_agency. Applies all cleansing logic
      (agency normalization, county string splitting, date parsing, offense
      sentence-casing) exactly once. Filters to Property / Person / Society only.
    config:
      tags: ['intermediate', 'core']
      meta:
        owner: 'data-engineering'
        tier: 'intermediate'
        pii: false
    columns:
      - name: agency_name
        description: "Normalized law enforcement agency name (regex-cleaned)"
        tests: [not_null]
      - name: county_name
        description: "Normalized county name(s), comma-sorted for multi-county agencies"
        tests: [not_null]
      - name: incident_date
        description: "Parsed incident date (DATE type)"
        tests: [not_null]
      - name: incident_hour
        description: "Hour of incident (0–23)"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 23
      - name: offense_name
        description: "Sentence-cased specific offense name"
        tests: [not_null]
      - name: crime_against
        description: "Victim classification: Property, Person, or Society"
        tests:
          - not_null
          - accepted_values:
              values: ['Property', 'Person', 'Society']
      - name: offense_category_name
        description: "Broad offense category (e.g., Larceny/Theft Offenses)"
        tests: [not_null]
      - name: offense_group
        description: "Offense group — populated for 2016–2020 records only; NULL for 1997–2015"
      - name: age_num
        description: "Age of offender (~47% null across both source datasets)"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 120
      - name: source_period
        description: "Source dataset identifier: '1997_2015' or '2016_2020'"
        tests:
          - not_null
          - accepted_values:
              values: ['1997_2015', '2016_2020']
      - name: incident_year
        tests: [not_null]
      - name: incident_month
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 12
      - name: day_of_week
        description: "Day of week (1=Sunday, 7=Saturday)"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 7
      - name: time_of_day
        description: "Daytime (6am–6pm) or nighttime classification"
        tests:
          - not_null
          - accepted_values:
              values: ['day', 'night']
      - name: season
        tests:
          - not_null
          - accepted_values:
              values: ['winter', 'spring', 'summer', 'fall']

  - name: int_income_population_unified
    description: >
      Unified county-year income and population snapshot. Merges Colorado income
      (pivoted to one row per county/year with Median Household Income and Per
      Capita Income as columns) with aggregated population data. Single source
      of truth for fct_income_population.
    config:
      tags: ['intermediate', 'core']
      meta:
        owner: 'data-engineering'
        tier: 'intermediate'
        pii: false
    columns:
      - name: county
        description: "County name (matches dim_geography.county_name)"
        tests: [not_null]
      - name: year
        tests: [not_null]
      - name: median_household_income
        description: "Median household income in USD; null if not reported for that year"
      - name: per_capita_income
        description: "Per capita personal income in USD"
      - name: total_personal_income
        description: "Total personal income (county aggregate) in thousands of USD"
      - name: total_population
        description: "Total county population from census/ACS estimates"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
      - name: male_population
      - name: female_population
      - name: population_yoy_change
        description: "Year-over-year absolute change in population"
      - name: population_growth_pct
        description: "Year-over-year % population growth (used for >10% growth KPI)"

  # ── Tier Ranking Chain ────────────────────────────────────────────────────
  # These models feed fct_business_subsidy_tiers via final_county_tier_rank.
  # Ranking logic: counties scored 1–4 per dimension (4 = highest need/risk).

  - name: crime_tiers
    description: >
      Per-county, per-offense-category crime tier (1–4) based on percentile rank
      of total crimes across all counties. Filters to the var('crime_categories')
      list. Feeds crime_tier_county_rank.
    config:
      tags: ['intermediate', 'tier_ranking']
      meta:
        owner: 'data-engineering'
        tier: 'intermediate'
    columns:
      - name: county_name
        tests: [not_null]
      - name: offense_category_name
        tests: [not_null]
      - name: total_crimes
        tests: [not_null]
      - name: crime_percentile
        description: "Percentile rank of this county for this offense category (0–1)"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: crime_tier
        description: "Tier 1 (low) to 4 (high) based on crime percentile quartile"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]

  - name: crime_tier_county_rank
    description: >
      Pivots crime_tiers to one row per county with per-category tier columns
      and an overall_crime_tier (average of all categories, rounded).
      Feeds final_county_tier_rank.
    config:
      tags: ['intermediate', 'tier_ranking']
      meta:
        owner: 'data-engineering'
        tier: 'intermediate'
    columns:
      - name: county_name
        tests: [not_null, unique]
      - name: overall_crime_tier
        description: "Rounded average crime tier across all configured offense categories"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 4

  - name: income_tier
    description: >
      Median household income tier per county (inverse ranking: lower income =
      higher tier number = higher need). Feeds final_county_tier_rank.
    config:
      tags: ['intermediate', 'tier_ranking']
      meta:
        owner: 'data-engineering'
        tier: 'intermediate'
    columns:
      - name: county
        tests: [not_null, unique]
      - name: avg_median_household_income
        tests: [not_null]
      - name: income_percentile
        description: "Percentile rank by income (0=lowest, 1=highest)"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: income_tier
        description: "Tier 1 (high income / low need) to 4 (low income / high need)"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]

  - name: population_crime_per_capita_tier
    description: >
      Crime-per-capita tier per county using average annual crime per 1,000
      residents. Higher crime rate per capita = higher tier = more B.A.S.E. need.
      Feeds final_county_tier_rank.
    config:
      tags: ['intermediate', 'tier_ranking']
      meta:
        owner: 'data-engineering'
        tier: 'intermediate'
    columns:
      - name: county
        tests: [not_null, unique]
      - name: avg_crime_per_1000
        description: "Average annual crimes per 1,000 residents across all available years"
        tests: [not_null]
      - name: crime_percentile
        description: "Percentile rank of crime-per-capita rate (0–1)"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: crime_per_capita_tier
        description: "Tier 1 (low rate / low need) to 4 (high rate / high need)"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]

  - name: final_county_tier_rank
    description: >
      Composite county-level tier combining crime_rank, income_rank, and
      population_rank via weighted average. This is the single county score
      consumed by fct_business_subsidy_tiers to assign B.A.S.E. eligibility.
    config:
      tags: ['intermediate', 'tier_ranking']
      meta:
        owner: 'data-engineering'
        tier: 'intermediate'
    columns:
      - name: county
        tests: [not_null, unique]
      - name: crime_rank
        description: "Crime tier from crime_tier_county_rank (1–4)"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 4
      - name: income_rank
        description: "Income tier from income_tier (1–4)"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 4
      - name: population_rank
        description: "Crime-per-capita tier from population_crime_per_capita_tier (1–4)"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 4
      - name: final_rank
        description: "Rounded average of all three dimension ranks — the B.A.S.E. composite score"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 4