version: 2

sources:
  - name: bronze
    database: "{{ env_var('SNOWFLAKE_CATALOG', 'COLORADO_CRIME_DB_DEV') }}"
    schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'RAW_DEV') }}"
    tables:
      - name: colorado_business_entities
        description: "Business entities from Colorado Department of State"
        columns:
          - name: entityid
            tests: [not_null, unique]
          - name: entityname
            tests: [not_null]
          - name: principalstate
            tests: [not_null]
          - name: entityformdate
            tests: [not_null]

      - name: colorado_county_coordinates
        description: "County boundary coordinates from CDPHE"
        columns:
          - name: county
            tests: [not_null, unique]
          - name: cent_lat
            tests: [not_null]
          - name: cent_long
            tests: [not_null]
      
      - name: colorado_crimes_1997_2015
        description: "Raw crime data from 1997-2015 from CDPS/FBI Crime Data Explorer"
        columns:
          - name: agency_name
            tests: [not_null]
          - name: primary_county
            tests: [not_null]
          - name: incident_date
            tests: [not_null]
          - name: offense_category_name
            tests: [not_null]
      
      - name: colorado_crimes_2016_2020
        description: "Raw crime data from 2016-2020 from FBI Crime Data Explorer"
        columns:
          - name: pub_agency_name
            tests: [not_null]
          - name: county_name
            tests: [not_null]
          - name: incident_date
            tests: [not_null]
          - name: offense_category_name
            tests: [not_null]

      - name: colorado_income
        description: "Personal income data from Colorado Department of Labor and Employment"
        columns:
          - name: areaname
            tests: [not_null]
          - name: periodyear
            tests: [not_null]
          - name: income
            tests: [not_null]
      
      - name: colorado_population
        description: "Population projections from Colorado Department of Local Affairs"
        columns:
          - name: county
            tests: [not_null]
          - name: year
            tests: [not_null]
          - name: totalpopulation
            tests: 
              - not_null
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 0

seeds:
  - name: colorado_city_county_zip
    description: "Reference table mapping zip codes to city/county"
    config:
      column_types:
        zip_code: integer
        city: varchar
        county: varchar
    columns:
      - name: zip_code
        tests: [not_null, unique]
      - name: city
        tests: [not_null]
      - name: county
        tests: [not_null]

  - name: colorado_county_boundaries
    description: "County boundary coordinates from CDPHE"
    config:
      column_types:
        county: varchar
        label: varchar
        cent_lat: double
        cent_long: double
    columns:
      - name: county
        tests: [not_null, unique]
      - name: cent_lat
        tests: [not_null]
      - name: cent_long
        tests: [not_null]