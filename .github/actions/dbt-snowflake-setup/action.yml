name: dbt Snowflake Setup (OIDC WIF)
description: >
  Fetches a Snowflake OIDC token via GitHub's workload identity federation,
  writes an ephemeral profiles.yml, installs a pinned dbt-snowflake version,
  and runs dbt deps (with package caching). Used by both the CI and CD
  workflows so the auth/setup logic only exists in one place.

inputs:
  snowflake-account:
    required: true
  snowflake-user:
    required: true
  snowflake-role:
    required: true
  snowflake-warehouse:
    required: true
  snowflake-database:
    required: true
  snowflake-schema:
    required: true
  dbt-target:
    required: true
    description: Target name to use in profiles.yml (e.g. 'ci' or 'prod')
  dbt-project-dir:
    required: true
    description: Path to the dbt project, relative to repo root
  dbt-snowflake-version:
    required: false
    default: "1.9.1"

runs:
  using: composite
  steps:
    - name: Fetch GitHub OIDC Token
      uses: actions/github-script@v7
      with:
        script: |
          const token = await core.getIDToken('snowflakecomputing.com');
          core.exportVariable('SNOWFLAKE_OIDC_TOKEN', token);
          core.setSecret(token);

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dbt Fusion (dbt-snowflake, pinned)
      shell: bash
      run: pip install "dbt-snowflake==${{ inputs.dbt-snowflake-version }}"

    - name: Generate ephemeral profiles.yml (OIDC WIF - never committed)
      shell: bash
      env:
        SNOWFLAKE_ACCOUNT_INPUT: ${{ inputs.snowflake-account }}
        SNOWFLAKE_USER: ${{ inputs.snowflake-user }}
        SNOWFLAKE_ROLE: ${{ inputs.snowflake-role }}
        SNOWFLAKE_WAREHOUSE: ${{ inputs.snowflake-warehouse }}
        SNOWFLAKE_DATABASE: ${{ inputs.snowflake-database }}
        SNOWFLAKE_SCHEMA: ${{ inputs.snowflake-schema }}
        DBT_TARGET: ${{ inputs.dbt-target }}
      run: |
        mkdir -p "$HOME/.dbt"
        {
          printf 'dbt_project:\n'
          printf '  target: %s\n' "${DBT_TARGET}"
          printf '  outputs:\n'
          printf '    %s:\n' "${DBT_TARGET}"
          printf '      type: snowflake\n'
          printf '      account: "%s"\n' "${SNOWFLAKE_ACCOUNT_INPUT}"
          printf '      user: "%s"\n' "${SNOWFLAKE_USER}"
          printf '      authenticator: WORKLOAD_IDENTITY\n'
          printf '      token: "%s"\n' "${SNOWFLAKE_OIDC_TOKEN}"
          printf '      database: "%s"\n' "${SNOWFLAKE_DATABASE}"
          printf '      schema: "%s"\n' "${SNOWFLAKE_SCHEMA}"
          printf '      warehouse: "%s"\n' "${SNOWFLAKE_WAREHOUSE}"
          printf '      role: "%s"\n' "${SNOWFLAKE_ROLE}"
          printf '      threads: 10\n'
          printf '      client_session_keep_alive: false\n'
        } > "$HOME/.dbt/profiles.yml"
        echo "profiles.yml written successfully"

    - name: Cache dbt packages
      uses: actions/cache@v4
      with:
        path: ${{ inputs.dbt-project-dir }}/dbt_packages
        key: dbt-packages-${{ hashFiles(format('{0}/packages.yml', inputs.dbt-project-dir)) }}

    - name: dbt deps
      shell: bash
      run: |
        cd "${GITHUB_WORKSPACE}/${{ inputs.dbt-project-dir }}"
        dbt deps --profiles-dir "$HOME/.dbt"
