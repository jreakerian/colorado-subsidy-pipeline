name: dbt CI (Slim CI — dbt Fusion & OIDC WIF)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'include/dbt/dbt_project/**'
      - '.github/workflows/dbt-ci.yml'
      - '.github/actions/dbt-snowflake-setup/**'
  workflow_dispatch:

concurrency:
  group: dbt-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  dbt-ci:
    name: Slim CI — dbt Fusion (OIDC WIF)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT_DEV || vars.SNOWFLAKE_ACCOUNT || secrets.SNOWFLAKE_ACCOUNT || 'MBJASEX-DLB27711' }}
      SNOWFLAKE_USER: CI_SVC
      SNOWFLAKE_ROLE: CICD_ROLE
      SNOWFLAKE_WAREHOUSE: TRANSFORMING_WH_PROD
      SNOWFLAKE_DATABASE: COLORADO_CRIME_DB_PROD
      SNOWFLAKE_SCHEMA: CI_PR_${{ github.event.pull_request.number || github.run_id }}
      PROJECT_DIR: ./include/dbt/dbt_project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up dbt + Snowflake OIDC auth
        uses: ./.github/actions/dbt-snowflake-setup
        with:
          snowflake-account: ${{ env.SNOWFLAKE_ACCOUNT }}
          snowflake-user: ${{ env.SNOWFLAKE_USER }}
          snowflake-role: ${{ env.SNOWFLAKE_ROLE }}
          snowflake-warehouse: ${{ env.SNOWFLAKE_WAREHOUSE }}
          snowflake-database: ${{ env.SNOWFLAKE_DATABASE }}
          snowflake-schema: ${{ env.SNOWFLAKE_SCHEMA }}
          dbt-target: ci
          dbt-project-dir: ${{ env.PROJECT_DIR }}

      # ── Download prod state for Slim CI ─────────────────────────────────────────
      # The CD workflow uploads target/ as 'dbt-prod-state' after every successful
      # production run. Slim CI uses this manifest to run only models that changed.
      # If no artifact exists (first ever run), the step is skipped gracefully and
      # we fall back to a full dbt build.
      - name: Download production state artifact (Slim CI baseline)
        id: download-state
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dbt-prod-state
          path: ${{ env.PROJECT_DIR }}/state

      # ── Create ephemeral CI schema in Snowflake ──────────────────────────────────
      # Fails the job on a real error (bad creds, no perms) instead of swallowing
      # it — only "schema already exists" is tolerated.
      - name: Create ephemeral CI schema
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eo pipefail
          if ! dbt run-operation create_schema \
            --profiles-dir "$HOME/.dbt" \
            --args "{schema_name: '${SNOWFLAKE_SCHEMA}', database_name: '${SNOWFLAKE_DATABASE}'}" \
            2>&1 | tee /tmp/create_schema.log; then
            if grep -qi "already exists" /tmp/create_schema.log; then
              echo "Schema already exists — continuing"
            else
              echo "::error::Failed to create ephemeral schema (see log above)"
              exit 1
            fi
          fi

      # ── Slim CI: run & test only modified models ─────────────────────────────────
      - name: dbt build — Slim CI (modified models only)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./state/manifest.json" ]; then
            echo "Prod state found — running Slim CI (modified+ models only, incremental)"
            dbt build \
              --profiles-dir "$HOME/.dbt" \
              --select "state:modified+" \
              --defer \
              --state ./state
          else
            echo "No prod state found — running full dbt build as fallback"
            dbt build \
              --profiles-dir "$HOME/.dbt"
          fi

      # ── Cleanup: drop ephemeral CI schema ───────────────────────────────────────
      - name: Drop ephemeral CI schema
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if ! dbt run-operation drop_schema \
            --profiles-dir "$HOME/.dbt" \
            --args "{schema_name: '${SNOWFLAKE_SCHEMA}', database_name: '${SNOWFLAKE_DATABASE}'}"; then
            echo "::warning::Failed to drop ephemeral schema ${SNOWFLAKE_SCHEMA} — manual cleanup may be needed"
          fi
