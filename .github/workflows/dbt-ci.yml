name: dbt CI (Zero-Copy Clone & OIDC WIF)

on:
  pull_request:
    paths:
      - 'include/dbt/dbt_project/**'
  push:
    branches:
      - dev
      - main
    paths:
      - 'include/dbt/dbt_project/**'
  workflow_dispatch:

concurrency:
  group: dbt-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # required to mint the GitHub OIDC token
  contents: read

jobs:
  dbt-ci:
    name: Zero-Copy Clone CI (OIDC WIF)
    runs-on: ubuntu-latest
    environment: dev  # Targets the 'dev' environment in GitHub Actions

    env:
      # Reads from GitHub Variables first, falling back to Secrets if stored there
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT  }}
      CICD_SNOWFLAKE_USER: DBT_CI_SVC
      CI_DATABASE: COLORADO_CRIME_DB_DEV
      CI_SCHEMA: CI_PR_${{ github.event.pull_request.number }}
      CI_WAREHOUSE: TRANSFORMING_WH_DEV
      CI_ROLE: CICD_ROLE

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (for dbt, SQLFluff & Snowflake helper)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install dbt-snowflake sqlfluff sqlfluff-templater-dbt "snowflake-connector-python>=3.17.0"

      - name: Fetch GitHub OIDC Token
        uses: actions/github-script@v7
        with:
          script: |
            // Snowflake WIF expects 'snowflakecomputing.com' as the audience claim
            const token = await core.getIDToken('snowflakecomputing.com');
            core.exportVariable('SNOWFLAKE_OIDC_TOKEN', token);
            core.setSecret(token);

      - name: dbt dependencies
        working-directory: ./include/dbt/dbt_project
        run: dbt deps



      - name: Generate ephemeral profiles.yml (OIDC WIF — never committed)
        run: |
          mkdir -p $HOME/.dbt
          echo "RUNNER_HOME=$HOME" >> $GITHUB_ENV
          python3 -c "
          import os, textwrap
          profile = textwrap.dedent('''
          dbt_project:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: {account}
                user: {user}
                authenticator: WORKLOAD_IDENTITY
                workload_identity_provider: OIDC
                token: {token}
                database: {database}
                schema: {schema}
                warehouse: {warehouse}
                role: {role}
                threads: 10
                client_session_keep_alive: false
          ''').strip().format(
              account=os.environ['SNOWFLAKE_ACCOUNT'],
              user=os.environ['CICD_SNOWFLAKE_USER'],
              token=os.environ['SNOWFLAKE_OIDC_TOKEN'],
              database=os.environ['CI_DATABASE'],
              schema=os.environ['CI_SCHEMA'],
              warehouse=os.environ['CI_WAREHOUSE'],
              role=os.environ['CI_ROLE'],
          )
          path = os.path.join(os.environ['HOME'], '.dbt', 'profiles.yml')
          open(path, 'w').write(profile)
          print('Wrote ephemeral profiles.yml to', path)
          "


      - name: Lint SQL
        working-directory: ./include/dbt/dbt_project
        env:
          DBT_PROFILES_DIR: ${{ env.RUNNER_HOME }}/.dbt
        run: sqlfluff lint models

      - name: Create Zero-Copy Clone Schema
        run: |
          python -c "
          import os, snowflake.connector

          conn = snowflake.connector.connect(
              account=os.environ['SNOWFLAKE_ACCOUNT'],
              user=os.environ['CICD_SNOWFLAKE_USER'],
              authenticator='WORKLOAD_IDENTITY',
              workload_identity_provider='OIDC',
              token=os.environ['SNOWFLAKE_OIDC_TOKEN'],
              role=os.environ['CI_ROLE'],
              database=os.environ['CI_DATABASE'],
          )
          schema = os.environ['CI_SCHEMA']
          src_db = os.environ['CI_DATABASE'].replace('DEV', 'PROD')

          with conn.cursor() as cur:
              print(f'Creating Zero-Copy Clone schema: {schema} from {src_db}.RAW')
              cur.execute(
                  f'CREATE SCHEMA IF NOT EXISTS {os.environ[\"CI_DATABASE\"]}.{schema} '
                  f'CLONE {src_db}.RAW '
                  f\"COMMENT = 'CI clone for PR #${{ github.event.pull_request.number }}'\"
              )
          conn.close()
          print('Clone schema created successfully.')
          "

      - name: Compile dbt project (generate manifest for slim CI state)
        working-directory: ./include/dbt/dbt_project
        run: |
          dbt compile --profiles-dir $HOME/.dbt

      - name: Run dbt build against Clone Schema
        working-directory: ./include/dbt/dbt_project
        run: |
          dbt build \
            --profiles-dir $HOME/.dbt \
            --full-refresh

      - name: Drop Zero-Copy Clone Schema
        if: always()
        run: |
          python -c "
          import os, snowflake.connector

          conn = snowflake.connector.connect(
              account=os.environ['SNOWFLAKE_ACCOUNT'],
              user=os.environ['CICD_SNOWFLAKE_USER'],
              authenticator='WORKLOAD_IDENTITY',
              workload_identity_provider='OIDC',
              token=os.environ['SNOWFLAKE_OIDC_TOKEN'],
              role=os.environ['CI_ROLE'],
              database=os.environ['CI_DATABASE'],
          )
          schema = os.environ['CI_SCHEMA']

          with conn.cursor() as cur:
              print(f'Dropping Zero-Copy Clone schema: {schema}')
              cur.execute(f'DROP SCHEMA IF EXISTS {os.environ[\"CI_DATABASE\"]}.{schema};')
          conn.close()
          print('Clone schema dropped successfully.')
          "