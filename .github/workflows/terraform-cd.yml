name: Terraform CD

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  id-token: write  # mint GitHub OIDC token for AWS + Snowflake WIF
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# FLOW:  plan → (approval gate) → apply → notify
#
# The plan job saves a binary plan artifact so the apply job executes the
# EXACT changes that were reviewed — no drift between plan and apply.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Plan ─────────────────────────────────────────────────────────────────
  plan:
    name: "Terraform Plan → Production"
    runs-on: ubuntu-latest

    env:
      WORKING_DIR: "./terraform"

    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exit_code }}

    steps:
      - uses: actions/checkout@v4

      # Shared setup: Terraform install, AWS OIDC, Snowflake WIF, terraform init
      - uses: ./.github/actions/terraform-setup
        with:
          aws-role-to-assume: ${{ vars.AWS_TERRAFORM_CD_ROLE_ARN }}
          snowflake-account:  ${{ vars.SNOWFLAKE_ACCOUNT }}
          environment:        prod

      - name: Show target environment
        run: |
          echo "🚀 Target:     prod"
          echo "📁 Vars file:  prod.tfvars"
          echo "🔑 Snowflake:  TF_CD_SVC @ ACCOUNTADMIN (WIF)"

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          SNOWFLAKE_AUTHENTICATOR:              WORKLOAD_IDENTITY
          SNOWFLAKE_TOKEN:                      ${{ env.SNOWFLAKE_OIDC_TOKEN }}
          SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC
        run: |
          set +e
          terraform plan \
            -var-file="prod.tfvars" \
            -var="snowflake_account=${{ vars.SNOWFLAKE_ACCOUNT }}" \
            -var="snowflake_user=TF_CD_SVC" \
            -var="snowflake_role=ACCOUNTADMIN" \
            -var="shared_rsa_public_key=${{ vars.SHARED_RSA_PUBLIC_KEY }}" \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -out=tfplan.binary
          exit_code=$?
          set -e

          # 0 = no changes, 2 = changes present — both are valid for CD
          if [ $exit_code -ne 0 ] && [ $exit_code -ne 2 ]; then
            echo "::error::Terraform plan failed with exit code $exit_code"
            exit $exit_code
          fi

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      # Convert the binary plan to human-readable text for the summary
      - name: Generate Plan Summary
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform show -no-color tfplan.binary > plan.txt
          echo "### 📋 Terraform Plan — \`prod\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```hcl' >> $GITHUB_STEP_SUMMARY
          head -200 plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Upload the binary plan so the apply job uses the exact same plan
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod-${{ github.sha }}
          path: |
            terraform/tfplan.binary
            terraform/.terraform.lock.hcl
          retention-days: 5

  # ── 2. Approval Gate ─────────────────────────────────────────────────────────
  # This job requires a manual approval in GitHub before apply can run.
  # To enable it:
  #   1. Go to Settings → Environments → New environment → name it "production"
  #   2. Enable "Required reviewers" and add yourself
  #   3. Optionally set a deployment branch rule to only allow from main
  #
  # Until the environment is created, this job runs immediately (no gate).
  apply:
    name: "Terraform Apply → Production"
    runs-on: ubuntu-latest
    needs: plan
    environment: production   # ← The approval gate lives here

    env:
      WORKING_DIR: "./terraform"

    steps:
      - uses: actions/checkout@v4

      # Re-run setup so AWS + Snowflake auth is fresh for the apply job
      - uses: ./.github/actions/terraform-setup
        with:
          aws-role-to-assume: ${{ vars.AWS_TERRAFORM_CD_ROLE_ARN }}
          snowflake-account:  ${{ vars.SNOWFLAKE_ACCOUNT }}
          environment:        prod

      # Download the exact binary plan produced by the plan job
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod-${{ github.sha }}
          path: terraform/

      - name: Terraform Apply (saved plan)
        id: apply
        working-directory: ${{ env.WORKING_DIR }}
        env:
          SNOWFLAKE_AUTHENTICATOR:              WORKLOAD_IDENTITY
          SNOWFLAKE_TOKEN:                      ${{ env.SNOWFLAKE_OIDC_TOKEN }}
          SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC
        run: |
          terraform apply -input=false -no-color tfplan.binary

      - name: Write Apply Summary
        if: always()
        run: |
          if [ "${{ steps.apply.outcome }}" == "success" ]; then
            echo "### ✅ Terraform Apply — \`prod\` — SUCCESS" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Terraform Apply — \`prod\` — FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  # ── 3. Notify ────────────────────────────────────────────────────────────────
  notify:
    name: "Slack Notification"
    runs-on: ubuntu-latest
    needs: [plan, apply]
    if: always()  # run even if apply failed so you always get notified

    steps:
      - name: Notify Slack
        # ── HOW TO SET UP SLACK NOTIFICATIONS ───────────────────────────────
        # 1. Go to https://api.slack.com/apps → Create New App → From Scratch
        # 2. Name it "GitHub Actions" and select your Slack workspace
        # 3. In the app settings → "Incoming Webhooks" → toggle ON
        # 4. Click "Add New Webhook to Workspace" → pick your #deploys channel
        # 5. Copy the webhook URL (looks like https://hooks.slack.com/services/T.../B.../...)
        # 6. In GitHub: Settings → Secrets and variables → Actions → Secrets
        #    Add a new secret: SLACK_WEBHOOK_URL = <your webhook URL>
        # 7. Uncomment the lines below and delete this comment block
        # ────────────────────────────────────────────────────────────────────
        #
        # uses: slackapi/slack-github-action@v2
        # with:
        #   webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        #   webhook-type: incoming-webhook
        #   payload: |
        #     {
        #       "text": "${{ needs.apply.result == 'success' && '✅' || '❌' }} *Terraform CD — prod*",
        #       "blocks": [
        #         {
        #           "type": "section",
        #           "text": {
        #             "type": "mrkdwn",
        #             "text": "${{ needs.apply.result == 'success' && '✅ *Terraform apply succeeded*' || '❌ *Terraform apply FAILED*' }}\n*Repo:* ${{ github.repository }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Actor:* @${{ github.actor }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
        #           }
        #         }
        #       ]
        #     }

        # ── PLACEHOLDER: remove this run block once Slack is configured ──────
        run: |
          echo "📣 Slack notification placeholder"
          echo "Apply result: ${{ needs.apply.result }}"
          echo "Plan exit code: ${{ needs.plan.outputs.plan_exit_code }}"
          echo "To enable Slack: follow the instructions in the notify step above"
