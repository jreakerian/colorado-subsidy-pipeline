name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  id-token: write      # mint GitHub OIDC token for AWS + Snowflake WIF
  contents: read
  pull-requests: write # post plan as PR comment

jobs:
  terraform:
    name: "Terraform Validate & Plan"
    runs-on: ubuntu-latest

    env:
      WORKING_DIR:    "./terraform"
      TF_VARS_FILE:   ${{ github.base_ref == 'main' && 'prod.tfvars' || 'dev.tfvars' }}
      TF_ENVIRONMENT: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}

    steps:
      # ── Shared setup: checkout, Terraform, AWS OIDC, Snowflake WIF, init ─────
      - uses: ./.github/actions/terraform-setup
        with:
          aws-role-to-assume: ${{ vars.AWS_TERRAFORM_CI_ROLE_ARN }}
          snowflake-account:  ${{ vars.SNOWFLAKE_ACCOUNT }}

      - name: Show target environment
        run: |
          echo "🌍 Base branch:  ${{ github.base_ref }}"
          echo "📁 Vars file:    ${{ env.TF_VARS_FILE }}"
          echo "🎯 Environment:  ${{ env.TF_ENVIRONMENT }}"

      - name: Terraform Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          SNOWFLAKE_AUTHENTICATOR: WORKLOAD_IDENTITY
          SNOWFLAKE_TOKEN:         ${{ env.SNOWFLAKE_OIDC_TOKEN }}
        run: |
          terraform plan \
            -var-file="${{ env.TF_VARS_FILE }}" \
            -var="snowflake_account=${{ vars.SNOWFLAKE_ACCOUNT }}" \
            -var="snowflake_user=TF_CI_SVC" \
            -var="snowflake_role=CICD_ROLE" \
            -var="snowflake_private_key_path=/dev/null" \
            -var="private_key_passphrase=" \
            -input=false \
            -no-color \
            -out=tfplan

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const plan = require('child_process')
              .execSync('terraform show -no-color tfplan', { cwd: '${{ env.WORKING_DIR }}' })
              .toString();
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n...(output truncated)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## 📋 Terraform Plan — `${{ env.TF_ENVIRONMENT }}` environment',
                '',
                '```hcl',
                truncated,
                '```',
              ].join('\n')
            });
