name: Deploy dbt Docs

on:
  workflow_run:
    workflows: ["dbt CD (Deploy to Production)"]
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'  # Run nightly at 2 AM
  workflow_dispatch:

permissions:
  id-token: write   # required to mint the GitHub OIDC token
  contents: write

jobs:
  deploy-docs:
    # Only run if the CD pipeline succeeded, OR if manually triggered/scheduled
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: prod
    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT  }}
      SNOWFLAKE_USER: DBT_CD_SVC
      CI_DATABASE: COLORADO_CRIME_DB_PROD
      CI_SCHEMA: PUBLIC
      CI_WAREHOUSE: TRANSFORMING_WH_PROD
      CI_ROLE: CICD_ROLE

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Fetch GitHub OIDC Token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('snowflakecomputing.com');
            core.exportVariable('SNOWFLAKE_OIDC_TOKEN', token);
            core.setSecret(token);

      - name: Generate ephemeral profiles.yml
        run: |
          mkdir -p $HOME/.dbt
          echo "RUNNER_HOME=$HOME" >> $GITHUB_ENV
          python3 -c "
          import os, textwrap
          profile = textwrap.dedent('''
          dbt_project:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: {account}
                user: {user}
                authenticator: WORKLOAD_IDENTITY
                workload_identity_provider: OIDC
                token: {token}
                database: {database}
                schema: {schema}
                warehouse: {warehouse}
                role: {role}
                threads: 10
                client_session_keep_alive: false
          ''').strip().format(
              account=os.environ['SNOWFLAKE_ACCOUNT'],
              user=os.environ['SNOWFLAKE_USER'],
              token=os.environ['SNOWFLAKE_OIDC_TOKEN'],
              database=os.environ['CI_DATABASE'],
              schema=os.environ['CI_SCHEMA'],
              warehouse=os.environ['CI_WAREHOUSE'],
              role=os.environ['CI_ROLE'],
          )
          path = os.path.join(os.environ['HOME'], '.dbt', 'profiles.yml')
          open(path, 'w').write(profile)
          print('Wrote ephemeral profiles.yml to', path)
          "

      - name: dbt dependencies
        working-directory: ./include/dbt/dbt_project
        run: dbt deps

      - name: Download CD state artifact (Fast Docs)
        # Only attempt to download if triggered by a workflow run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dbt-prod-state
          path: ${{ env.DBT_PROJECT_DIR }}/state
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docs
        working-directory: ./include/dbt/dbt_project
        run: |
          if [ -d "state" ]; then
            echo "State found, generating docs without recompiling"
            dbt docs generate --profiles-dir $HOME/.dbt --state ./state
          else
            echo "No state found, generating docs from scratch"
            dbt docs generate --profiles-dir $HOME/.dbt
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./include/dbt/dbt_project/target
