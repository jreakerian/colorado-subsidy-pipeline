name: Deploy dbt Docs

on:
  workflow_run:
    workflows: ["dbt CD (Deploy to Production)"]
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'  # Run nightly at 2 AM UTC
  workflow_dispatch:

permissions:
  id-token: write   # Required to mint the GitHub OIDC token for Snowflake WIF
  contents: write   # Required for peaceiris/actions-gh-pages to push to gh-pages branch

jobs:
  deploy-docs:
    # Only run if CD succeeded — OR if manually/schedule triggered (not a workflow_run event)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: prod

    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT_PROD }}
      SNOWFLAKE_USER: CD_SVC
      SNOWFLAKE_ROLE: CICD_ROLE
      SNOWFLAKE_WAREHOUSE: TRANSFORMING_WH_PROD
      SNOWFLAKE_DATABASE: COLORADO_CRIME_DB_PROD
      SNOWFLAKE_SCHEMA: PUBLIC
      DBT_PROJECT_DIR: include/dbt/dbt_project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Export absolute dbt project path ─────────────────────────────────────
      # Needed so all subsequent steps can reference the project directory
      # without ambiguity regardless of which working-directory they use.
      - name: Set absolute dbt project path
        run: echo "DBT_PROJECT_DIR_ABS=${GITHUB_WORKSPACE}/${DBT_PROJECT_DIR}" >> "$GITHUB_ENV"

      # ── Auth + Python + dbt install (reusable composite action) ──────────────
      # Handles: OIDC token fetch → Python 3.11 setup (with pip cache) →
      # pip install dbt-snowflake (pinned) → ephemeral profiles.yml → dbt deps.
      # Identical to what dbt-ci.yml and dbt-cd.yml use — no duplication.
      - name: Set up dbt + Snowflake OIDC auth
        uses: ./.github/actions/dbt-snowflake-setup
        with:
          snowflake-account: ${{ env.SNOWFLAKE_ACCOUNT }}
          snowflake-user: ${{ env.SNOWFLAKE_USER }}
          snowflake-role: ${{ env.SNOWFLAKE_ROLE }}
          snowflake-warehouse: ${{ env.SNOWFLAKE_WAREHOUSE }}
          snowflake-database: ${{ env.SNOWFLAKE_DATABASE }}
          snowflake-schema: ${{ env.SNOWFLAKE_SCHEMA }}
          dbt-target: prod
          dbt-project-dir: ${{ env.DBT_PROJECT_DIR }}

      # ── Download CD state artifact (Fast Docs) ────────────────────────────────
      # When triggered via workflow_run, the CD manifest is immediately available
      # via its run ID. We pass it to `dbt docs generate --state` to skip the
      # expensive recompile step (catalog query only). Falls back gracefully.
      - name: Download CD state artifact (Fast Docs)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dbt-prod-state
          path: ${{ env.DBT_PROJECT_DIR }}/state
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Generate docs ─────────────────────────────────────────────────────────
      # If the CD state was downloaded, pass --state to skip recompilation.
      # On schedule/manual triggers where no state is available, compile from scratch.
      - name: Generate dbt Docs
        run: |
          if [ -f "${DBT_PROJECT_DIR_ABS}/state/manifest.json" ]; then
            echo "State found — generating docs without recompiling (catalog query only)"
            dbt docs generate \
              --profiles-dir "$HOME/.dbt" \
              --project-dir "${DBT_PROJECT_DIR_ABS}" \
              --state "${DBT_PROJECT_DIR_ABS}/state"
          else
            echo "No state found — generating docs from scratch (full compile + catalog)"
            dbt docs generate \
              --profiles-dir "$HOME/.dbt" \
              --project-dir "${DBT_PROJECT_DIR_ABS}"
          fi

      # ── Deploy to GitHub Pages ────────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DBT_PROJECT_DIR }}/target
