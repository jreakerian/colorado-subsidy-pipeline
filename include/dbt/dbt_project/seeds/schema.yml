version: 2

seeds:
  - name: colorado_city_county_zip
    description: >
      Reference table mapping Colorado zip codes to city and county.
      Used to enrich address data in downstream models.
    config:
      column_types:
        zip_code: integer
        city: varchar
        county: varchar
    columns:
      - name: zip_code
        description: "5-digit USPS zip code"
        tests:
          - not_null
          - unique
      - name: city
        description: "City name associated with the zip code"
        tests:
          - not_null
      - name: county
        description: "Colorado county name associated with the zip code"
        tests:
          - not_null

  - name: colorado_county_boundaries
    description: >
      County centroid coordinates for all Colorado counties, sourced from CDPHE.
      Used for geographic enrichment and mapping in downstream models.
    config:
      column_types:
        county: varchar
        label: varchar
        cent_lat: double
        cent_long: double
    columns:
      - name: county
        description: "Uppercase county name (e.g. LARIMER)"
        tests:
          - not_null
          - unique
      - name: label
        description: "Title-cased county name (e.g. Larimer)"
        tests:
          - not_null
      - name: cent_lat
        description: "Centroid latitude of the county"
        tests:
          - not_null
      - name: cent_long
        description: "Centroid longitude of the county"
        tests:
          - not_null

  - name: agency_city_mapping
    description: >
      Maps Colorado law enforcement agency names (pub_agency_name from the
      2016-2024 crimes dataset) to their associated city. Used in
      int_crimes_unified to resolve city_name for records that lack a city
      column in the source CSV.
      Mapping rules:
        - City police agencies → city name (e.g. 'Denver', 'Aurora')
        - County sheriff agencies → '[County Level]'
        - State / university agencies → NULL (cannot be attributed to a city)
    config:
      column_types:
        pub_agency_name: varchar
        city_name: varchar
    columns:
      - name: pub_agency_name
        description: "Public agency name as it appears in the source crimes dataset"
        tests:
          - not_null
          - unique
      - name: city_name
        description: "Resolved city name, '[County Level]', or NULL for unresolvable agencies"
