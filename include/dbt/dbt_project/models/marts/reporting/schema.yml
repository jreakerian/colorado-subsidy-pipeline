version: 2

# ══════════════════════════════════════════════════════════════════════════
# Reporting layer — trimmed down to models that genuinely need to be
# physical tables rather than semantic-layer queries:
#   - rpt_business_tier_lookup: a public-facing search tool (businesses
#     query by entity_id/entity_name), needs a fast directly-queryable
#     table rather than a live MetricFlow-compiled query.
#   - rpt_county_agency_crime_baseline: operational (sets a per-agency
#     crime-reduction target), same reasoning.
#
# NOTE: rpt_business_tier_lookup has semantic_model: disabled.
# It is a one-row-per-business snapshot table with no natural time spine.
# MetricFlow requires agg_time_dimension for any semantic model with
# metrics. Business-level metrics (business_count, avg_composite_tier,
# etc.) are served from fct_business_subsidy_tiers instead.
# ══════════════════════════════════════════════════════════════════════════

models:

  # ══════════════════════════════════════════════════════════════════════════
  # LAW ENFORCEMENT — Police Agency Operational Planning
  # ══════════════════════════════════════════════════════════════════════════

  - name: rpt_county_agency_crime_baseline
    description: >-
      County Level KPI #1. Set a goal for each police agency within a given
      county to reduce crime by 5% within the next fiscal year, based on
      historical crime count baseline.
    config:
      contract:
        enforced: true
      tags: ['marts', 'reporting', 'law_enforcement', 'kpi']
    primary_entity: county_agency_baseline
    agg_time_dimension: first_incident_date
    semantic_model:
      enabled: true
    columns:
      - name: county_name
        data_type: varchar
        tests: [not_null]
        entity:
          type: foreign
          name: county
        dimension:
          type: categorical
      - name: agency_name
        data_type: varchar
        tests: [not_null]
        entity:
          type: foreign
          name: agency_baseline
        dimension:
          type: categorical
      - name: total_crimes
        data_type: integer
        tests: [not_null]
      - name: target_crimes_5pct_reduction
        data_type: integer
        tests: [not_null]
      - name: first_incident_date
        data_type: date
        tests: [not_null]
        granularity: day
        dimension:
          type: time
      - name: last_incident_date
        data_type: date
        tests: [not_null]
    metrics:
      - name: agency_total_crimes
        type: simple
        label: "Agency Total Crimes"
        description: "County KPI #1. Total historical crime count per police agency."
        agg: sum
        expr: total_crimes
        fill_nulls_with: 0
      - name: agency_target_crimes_5pct_reduction
        type: simple
        label: "Agency 5% Reduction Target"
        description: "County KPI #1. Target crime count reflecting a 5% reduction goal per agency; additive across agencies."
        agg: sum
        expr: target_crimes_5pct_reduction
        fill_nulls_with: 0
      - name: agency_first_incident_date
        type: simple
        label: "Agency First Incident Date"
        agg: min
        expr: first_incident_date
        hidden: true
      - name: agency_last_incident_date
        type: simple
        label: "Agency Last Incident Date"
        agg: max
        expr: last_incident_date
        hidden: true

  # ══════════════════════════════════════════════════════════════════════════
  # BUSINESS PORTAL — B.A.S.E. Self-Service Tier Lookup
  # Audience: Colorado business owners registered with CDOS
  # Purpose: Allow businesses to search their assigned security subsidy tier.
  #          OEDIT uses this same model to trigger automated notifications.
  #
  # Semantic model DISABLED — this is a snapshot table (one row per business)
  # with no natural time series. MetricFlow requires agg_time_dimension for
  # any semantic model with metrics. Business metrics are served from
  # fct_business_subsidy_tiers (facts/schema.yml) instead.
  # ══════════════════════════════════════════════════════════════════════════

  - name: rpt_business_tier_lookup
    description: >-
      B.A.S.E. Program front-facing tier search tool. Business owners search
      by entity_id or entity_name to see their assigned subsidy tier. OEDIT
      queries this model to automatically notify all notification_eligible
      businesses, streamlining the application process. Powered by
      fct_business_subsidy_tiers.
    config:
      contract:
        enforced: true
      tags: ['marts', 'reporting', 'business_portal', 'kpi', 'base_program']
    semantic_model:
      enabled: false
    columns:
      - name: entity_id
        data_type: integer
        tests: [not_null, unique]
      - name: entity_name
        data_type: varchar
        tests: [not_null]
      - name: principal_city
        data_type: varchar
      - name: principal_county
        data_type: varchar
        tests: [not_null]
      - name: principal_zip
        data_type: varchar
      - name: entity_type
        data_type: varchar
      - name: formation_date
        data_type: date
      - name: crime_tier
        data_type: integer
      - name: income_tier
        data_type: integer
      - name: population_tier
        data_type: integer
      - name: composite_tier
        data_type: integer
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 4
      - name: subsidy_tier_label
        data_type: varchar
      - name: qualifies_for_subsidy
        data_type: boolean
        tests: [not_null]
      - name: notification_eligible
        data_type: boolean
        tests: [not_null]
      - name: subsidy_message
        data_type: varchar
        tests: [not_null]

  # ══════════════════════════════════════════════════════════════════════════
  # LAW ENFORCEMENT — City-Level Crime KPIs (Phase 1.2)
  # Audience: Law enforcement planners, city-level crime analysts
  # Source: fct_crimes.city_geo_key → dim_geography (city rows only)
  # ══════════════════════════════════════════════════════════════════════════

  - name: rpt_city_time_trends
    description: >-
      City KPI 1 & 6. Seasonal crime trends and day-of-week crime patterns per city.
      One row per city × month × day_of_week. Only includes records where
      city_geo_key is not null (i.e., city was successfully resolved via
      agency_city_mapping seed). Window functions provide avg_monthly_crimes and
      avg_dow_crimes for trend comparison.
    config:
      tags: ['marts', 'reporting', 'law_enforcement', 'city', 'kpi']
    columns:
      - name: city_name
        data_type: varchar
        tests: [not_null]
        description: "Resolved city name from dim_geography"
      - name: county_name
        data_type: varchar
        tests: [not_null]
        description: "Parent county for the city"
      - name: month
        data_type: integer
        tests: [not_null]
        description: "Month number (1-12)"
      - name: month_name
        data_type: varchar
        tests: [not_null]
        description: "Month name (January-December)"
      - name: season
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['winter', 'spring', 'summer', 'fall']
        description: "Season derived from month"
      - name: day_of_week
        data_type: integer
        tests: [not_null]
        description: "Day of week (1=Sunday, 7=Saturday)"
      - name: day_name
        data_type: varchar
        tests: [not_null]
        description: "Day name (Monday-Sunday)"
      - name: total_crimes
        data_type: integer
        tests: [not_null]
        description: "Total crime incidents for this city × month × day_of_week"
      - name: avg_monthly_crimes
        data_type: float
        description: "Window avg: average crimes for this city in this month across all day-of-weeks"
      - name: avg_dow_crimes
        data_type: float
        description: "Window avg: average crimes for this city on this day-of-week across all months"

  - name: rpt_city_time_of_day_crimes
    description: >-
      City KPI 2 & 4. Top 3 most common crime categories during daytime (6AM-6PM)
      and nighttime (6PM-6AM) per city. One row per city × time_of_day ×
      offense_category_name where rank ≤ 3. Rank 1 = highest crime count.
    config:
      tags: ['marts', 'reporting', 'law_enforcement', 'city', 'kpi']
    columns:
      - name: city_name
        data_type: varchar
        tests: [not_null]
      - name: county_name
        data_type: varchar
        tests: [not_null]
      - name: time_of_day
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['day', 'night']
        description: "Incident time slot: 'day' (6AM-6PM) or 'night' (6PM-6AM)"
      - name: offense_category_name
        data_type: varchar
        tests: [not_null]
        description: "Broad crime category"
      - name: crime_against
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Property', 'Person', 'Society']
      - name: crime_count
        data_type: integer
        tests: [not_null]
        description: "Total incidents for this city × time_of_day × offense_category"
      - name: rnk
        data_type: integer
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
        description: "Rank within city × time_of_day (1 = most common)"

  - name: rpt_city_crime_demographics
    description: >-
      City KPI 3 & 5. Average offender age and crime type distribution
      (Property / Person / Society) per city. One row per city ×
      offense_category_name × crime_against. avg_offender_age is NULL for
      records where age was not captured in the source (~47% of all incidents).
    config:
      tags: ['marts', 'reporting', 'law_enforcement', 'city', 'kpi']
    columns:
      - name: city_name
        data_type: varchar
        tests: [not_null]
      - name: county_name
        data_type: varchar
        tests: [not_null]
      - name: offense_category_name
        data_type: varchar
        tests: [not_null]
      - name: crime_against
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Property', 'Person', 'Society']
        description: "Crime classification: Property, Person, or Society"
      - name: total_crimes
        data_type: integer
        tests: [not_null]
        description: "Total incidents for this city × offense_category × crime_against"
      - name: avg_offender_age
        data_type: float
        description: "Average age of individual involved; NULL where age was not recorded"
      - name: pct_of_city_crimes
        data_type: float
        description: "Percentage share of this row's crimes out of all city crimes (0-100)"
