version: 2

# ══════════════════════════════════════════════════════════════════════════
# Reporting layer — trimmed down to models that genuinely need to be
# physical tables rather than semantic-layer queries:
#   - rpt_business_tier_lookup: a public-facing search tool (businesses
#     query by entity_id/entity_name), needs a fast directly-queryable
#     table rather than a live MetricFlow-compiled query.
#   - rpt_county_agency_crime_baseline: operational (sets a per-agency
#     crime-reduction target), same reasoning.
# ══════════════════════════════════════════════════════════════════════════

models:

  # ══════════════════════════════════════════════════════════════════════════
  # LAW ENFORCEMENT — Police Agency Operational Planning
  # ══════════════════════════════════════════════════════════════════════════

  - name: rpt_county_agency_crime_baseline
    description: >
      County Level KPI #1.
      Set a goal for each police agency within a given county to reduce crime
      by 5% within the next fiscal year, based on historical crime count baseline.
    config:
      tags: ['marts', 'reporting', 'law_enforcement', 'kpi']
    semantic_model:
      enabled: true
    columns:
      - name: county_name
        tests: [not_null]
        entity:
          name: county
          type: foreign
      - name: agency_name
        tests: [not_null]
        entity:
          name: agency_baseline
          type: foreign
      - name: total_crimes
        tests: [not_null]
      - name: target_crimes_5pct_reduction
        tests: [not_null]
      - name: first_incident_date
        tests: [not_null]
      - name: last_incident_date
        tests: [not_null]
    metrics:
      - name: agency_total_crimes
        type: simple
        label: "Agency Total Crimes"
        description: "County KPI #1. Total historical crime count per police agency."
        agg: sum
        expr: total_crimes
      - name: agency_target_crimes_5pct_reduction
        type: simple
        label: "Agency 5% Reduction Target"
        description: "County KPI #1. Target crime count reflecting a 5% reduction goal per agency; additive across agencies."
        agg: sum
        expr: target_crimes_5pct_reduction
      - name: agency_first_incident_date
        type: simple
        label: "Agency First Incident Date"
        agg: min
        expr: first_incident_date
      - name: agency_last_incident_date
        type: simple
        label: "Agency Last Incident Date"
        agg: max
        expr: last_incident_date

  # ══════════════════════════════════════════════════════════════════════════
  # BUSINESS PORTAL — B.A.S.E. Self-Service Tier Lookup
  # Audience: Colorado business owners registered with CDOS
  # Purpose: Allow businesses to search their assigned security subsidy tier.
  #          OEDIT uses this same model to trigger automated notifications.
  # ══════════════════════════════════════════════════════════════════════════

  - name: rpt_business_tier_lookup
    description: >
      B.A.S.E. Program front-facing tier search tool.
      Business owners search by entity_id or entity_name to see their assigned
      subsidy tier. OEDIT queries this model to automatically notify all
      notification_eligible businesses, streamlining the application process.
      Powered by fct_business_subsidy_tiers.
    config:
      tags: ['marts', 'reporting', 'business_portal', 'kpi', 'base_program']
    semantic_model:
      enabled: true
    agg_time_dimension: formation_date
    columns:
      - name: entity_id
        tests: [not_null, unique]
        entity:
          name: business
          type: primary
      - name: entity_name
        tests: [not_null]
        dimension:
          type: categorical
      - name: principal_city
        dimension:
          type: categorical
      - name: principal_county
        tests: [not_null]
        dimension:
          type: categorical
      - name: principal_zip
        dimension:
          type: categorical
      - name: entity_type
        dimension:
          type: categorical
      - name: formation_date
        granularity: day
        dimension:
          type: time
      - name: composite_tier
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 4
      - name: subsidy_tier_label
        dimension:
          type: categorical
      - name: qualifies_for_subsidy
        tests: [not_null]
        dimension:
          type: categorical
      - name: notification_eligible
        tests: [not_null]
        dimension:
          type: categorical
      - name: subsidy_message
        tests: [not_null]
    metrics:
      - name: business_count
        type: simple
        label: "Business Count"
        description: "Count of Colorado businesses in the B.A.S.E. tier lookup, sliceable by tier/county/type."
        agg: count
        expr: entity_id
      - name: avg_business_composite_tier
        type: simple
        label: "Avg Business Composite Tier"
        agg: average
        expr: composite_tier
      - name: avg_business_crime_tier
        type: simple
        label: "Avg Business Crime Tier"
        agg: average
        expr: crime_tier
      - name: avg_business_income_tier
        type: simple
        label: "Avg Business Income Tier"
        agg: average
        expr: income_tier
      - name: avg_business_population_tier
        type: simple
        label: "Avg Business Population Tier"
        agg: average
        expr: population_tier
      - name: subsidy_qualifying_business_count
        type: simple
        label: "Subsidy-Qualifying Business Count"
        description: "Count of businesses that qualify for a B.A.S.E. subsidy (composite_tier >= 3)."
        agg: sum_boolean
        expr: qualifies_for_subsidy
      - name: notification_eligible_business_count
        type: simple
        label: "Notification-Eligible Business Count"
        description: "Count of businesses eligible for automated OEDIT notification."
        agg: sum_boolean
        expr: notification_eligible
