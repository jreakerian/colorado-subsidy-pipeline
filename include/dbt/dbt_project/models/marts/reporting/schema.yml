version: 2

# ══════════════════════════════════════════════════════════════════════════
# Reporting layer — trimmed down to models that genuinely need to be
# physical tables rather than semantic-layer queries:
#   - rpt_business_tier_lookup: a public-facing search tool (businesses
#     query by entity_id/entity_name), needs a fast directly-queryable
#     table rather than a live MetricFlow-compiled query.
#   - rpt_county_agency_crime_baseline: operational (sets a per-agency
#     crime-reduction target), same reasoning.
#
# NOTE: rpt_business_tier_lookup has semantic_model: disabled.
# It is a one-row-per-business snapshot table with no natural time spine.
# MetricFlow requires agg_time_dimension for any semantic model with
# metrics. Business-level metrics (business_count, avg_composite_tier,
# etc.) are served from fct_business_subsidy_tiers instead.
# ══════════════════════════════════════════════════════════════════════════

models:

  # ══════════════════════════════════════════════════════════════════════════
  # LAW ENFORCEMENT — Police Agency Operational Planning
  # ══════════════════════════════════════════════════════════════════════════

  - name: rpt_county_agency_crime_baseline
    description: >-
      County Level KPI #1. Set a goal for each police agency within a given
      county to reduce crime by 5% within the next fiscal year, based on
      historical crime count baseline.
    config:
      tags: ['marts', 'reporting', 'law_enforcement', 'kpi']
    primary_entity: county_agency_baseline
    agg_time_dimension: first_incident_date
    semantic_model:
      enabled: true
    columns:
      - name: county_name
        tests: [not_null]
        entity:
          type: foreign
          name: county
        dimension:
          type: categorical
      - name: agency_name
        tests: [not_null]
        entity:
          type: foreign
          name: agency_baseline
        dimension:
          type: categorical
      - name: total_crimes
        tests: [not_null]
      - name: target_crimes_5pct_reduction
        tests: [not_null]
      - name: first_incident_date
        tests: [not_null]
        granularity: day
        dimension:
          type: time
      - name: last_incident_date
        tests: [not_null]
    metrics:
      - name: agency_total_crimes
        type: simple
        label: "Agency Total Crimes"
        description: "County KPI #1. Total historical crime count per police agency."
        agg: sum
        expr: total_crimes
        fill_nulls_with: 0
      - name: agency_target_crimes_5pct_reduction
        type: simple
        label: "Agency 5% Reduction Target"
        description: "County KPI #1. Target crime count reflecting a 5% reduction goal per agency; additive across agencies."
        agg: sum
        expr: target_crimes_5pct_reduction
        fill_nulls_with: 0
      - name: agency_first_incident_date
        type: simple
        label: "Agency First Incident Date"
        agg: min
        expr: first_incident_date
        hidden: true
      - name: agency_last_incident_date
        type: simple
        label: "Agency Last Incident Date"
        agg: max
        expr: last_incident_date
        hidden: true

  # ══════════════════════════════════════════════════════════════════════════
  # BUSINESS PORTAL — B.A.S.E. Self-Service Tier Lookup
  # Audience: Colorado business owners registered with CDOS
  # Purpose: Allow businesses to search their assigned security subsidy tier.
  #          OEDIT uses this same model to trigger automated notifications.
  #
  # Semantic model DISABLED — this is a snapshot table (one row per business)
  # with no natural time series. MetricFlow requires agg_time_dimension for
  # any semantic model with metrics. Business metrics are served from
  # fct_business_subsidy_tiers (facts/schema.yml) instead.
  # ══════════════════════════════════════════════════════════════════════════

  - name: rpt_business_tier_lookup
    description: >-
      B.A.S.E. Program front-facing tier search tool. Business owners search
      by entity_id or entity_name to see their assigned subsidy tier. OEDIT
      queries this model to automatically notify all notification_eligible
      businesses, streamlining the application process. Powered by
      fct_business_subsidy_tiers.
    config:
      tags: ['marts', 'reporting', 'business_portal', 'kpi', 'base_program']
    semantic_model:
      enabled: false
    columns:
      - name: entity_id
        tests: [not_null, unique]
      - name: entity_name
        tests: [not_null]
      - name: principal_city
      - name: principal_county
        tests: [not_null]
      - name: principal_zip
      - name: entity_type
      - name: formation_date
      - name: composite_tier
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 4
      - name: subsidy_tier_label
      - name: qualifies_for_subsidy
        tests: [not_null]
      - name: notification_eligible
        tests: [not_null]
      - name: subsidy_message
        tests: [not_null]