version: 2

# ══════════════════════════════════════════════════════════════════════════
# Semantic Layer — fact grain.
#
# fct_crimes and fct_income_population carry the semantic layer's core
# metrics (this replaces the 13 hand-aggregated rpt_* reports that used to
# live in models/marts/reporting/oedit and .../law_enforcement — see git
# history / chat for what was removed). Both facts share a "geo" entity
# (dim_geography.geo_key), which is what lets the cross-model
# crime_rate_per_100k metric in _cross_model_metrics.yml join them live.
#
# Known behavior differences vs. the old rpt_* models, worth knowing:
#   - Ranking (e.g. "top 3 crime categories per city") isn't a MetricFlow
#     concept — query total_crimes grouped by city + offense_category_name
#     (optionally filtered to time_of_day) and apply ORDER BY / LIMIT / rank
#     in the BI tool.
#   - "% of total" (e.g. pct_of_county_total) likewise isn't baked into a
#     metric — query total_crimes by the grouping dimension and compute the
#     share client-side (virtually every BI tool does this as a table calc).
#   - Dropping the date/year dimension from a query sums total_crimes across
#     the whole 1997-2024 window rather than averaging per year, unlike the
#     old avg_monthly_crimes/avg_daily_crimes columns. Divide by count of
#     distinct years client-side if you need the per-year average.
#   - crime_avg_age does not reproduce the old rpt_city_avg_age_per_crime's
#     age_num BETWEEN 10 AND 100 clamp or its HAVING count >= 5 statistical-
#     significance filter. Query it alongside total_crimes and filter low-
#     count rows client-side if needed.
# ══════════════════════════════════════════════════════════════════════════

# ── dbt model definitions (tests, column docs, tags only) ─────────────────
models:
  - name: fct_crimes
    description: "Core crime incident fact table. Granularity: 1 row per incident (1997-2024). All crime KPIs aggregate from this table via dimension joins. Crime incident semantic model. Primary entity: crime_incident. Joins to geo, date, offense, agency via foreign keys."
    config:
      contract:
        enforced: true
      tags: ['marts', 'fact']
    columns:
      - name: date_key
        data_type: varchar
        tests: [not_null]
        description: "FK to dim_date"
        entity:
          type: foreign
          name: date
      - name: geo_key
        data_type: integer
        tests: [not_null]
        description: "FK to dim_geography"
        entity:
          type: foreign
          name: geo
      - name: offense_key
        data_type: integer
        tests: [not_null]
        description: "FK to dim_offense"
        entity:
          type: foreign
          name: offense
      - name: agency_key
        data_type: integer
        description: "FK to dim_agency (nullable for unmatched agencies)"
        entity:
          type: foreign
          name: agency
      - name: incident_date
        data_type: date
        tests: [not_null]
        granularity: day
        dimension:
          type: time
      - name: incident_hour
        data_type: integer
        description: "Hour of the incident (0-23)"
      - name: time_of_day
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['day', 'night']
        dimension:
          type: categorical
      - name: age_num
        data_type: integer
        description: "Recorded age of individual involved"
      - name: source_period
        data_type: varchar
        description: "Source dataset time period designation"
      - name: crime_count
        data_type: integer
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 1

    primary_entity: crime_incident
    agg_time_dimension: incident_date
    semantic_model:
      enabled: true
    metrics:
      - name: total_crimes
        type: simple
        label: "Total Crimes"
        description: "Crime incident count. Slice by any combination of geo/offense/agency/date dimensions to reproduce any of the old county- or city-level crime KPIs."
        agg: sum
        expr: crime_count
        fill_nulls_with: 0
      - name: crime_avg_age
        type: simple
        label: "Crime Avg Age"
        description: "Average recorded age of individuals involved (source age_num is ~47% null; nulls are ignored by AVG, not clamped or filtered)."
        agg: average
        expr: age_num
  - name: fct_income_population
    description: "Annual county income and population snapshot fact. Granularity: 1 row per county per year (1997-2024). County income and population semantic model. Granularity: 1 row per county per year."
    config:
      contract:
        enforced: true
      tags: ['marts', 'fact']
    columns:
      - name: geo_key
        data_type: integer
        tests: [not_null]
        description: "FK to dim_geography (county-level rows only)"
        entity:
          type: foreign
          name: geo
      - name: year
        data_type: integer
        tests: [not_null]
      - name: year_date
        data_type: date
        description: "Synthetic Jan-1-of-year date; the real time dimension backing agg_time_dimension for this model."
        granularity: year
        dimension:
          type: time
      - name: total_population
        data_type: integer
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: male_population
        data_type: integer
      - name: female_population
        data_type: integer
      - name: median_household_income
        data_type: float
      - name: per_capita_income
        data_type: float
      - name: total_personal_income
        data_type: float
      - name: population_yoy_change
        data_type: integer
        description: "Year-over-year absolute change in population"
      - name: population_growth_pct
        data_type: float
        description: "Year-over-year % population growth (used for >10% growth KPI)"

    primary_entity: county_year
    agg_time_dimension: year_date
    semantic_model:
      enabled: true
    metrics:
      - name: avg_median_household_income
        type: simple
        label: "Avg Median Household Income"
        description: "KPI #2. Median household income; average across whatever years are in scope."
        agg: average
        expr: median_household_income
      - name: avg_per_capita_income
        type: simple
        label: "Avg Per Capita Income"
        description: "KPI #8. Per capita income; average across whatever years are in scope."
        agg: average
        expr: per_capita_income
      - name: avg_total_personal_income
        type: simple
        label: "Avg Total Personal Income"
        agg: average
        expr: total_personal_income
      - name: avg_total_population
        type: simple
        label: "Avg Total Population"
        description: "Population is a point-in-time snapshot, not additive across years — always aggregated as an average, never summed."
        agg: average
        expr: total_population
      - name: avg_population_yoy_change
        type: simple
        label: "Avg Population YoY Change"
        agg: average
        expr: population_yoy_change
      - name: avg_population_growth_pct
        type: simple
        label: "Avg Population Growth %"
        description: "KPI #4 input. Year-over-year population growth %."
        agg: average
        expr: population_growth_pct
      - name: counties_exceeding_10pct_growth_years
        type: simple
        label: "County-Years Exceeding 10% Population Growth"
        description: "KPI #4. Count of county-year rows where population growth exceeded 10%."
        agg: sum
        expr: "case when population_growth_pct > 10 then 1 else 0 end"
  - name: fct_business_subsidy_tiers
    description: "B.A.S.E. program core output. One row per eligible business with composite subsidy tier. This is the central deliverable of the B.A.S.E. program."
    config:
      contract:
        enforced: true
      tags: ['marts', 'fact', 'base_program']
    agg_time_dimension: formation_date
    semantic_model:
      enabled: true
    columns:
      - name: business_key
        data_type: varchar
        tests: [not_null, unique]
        description: "FK to dim_business"
        entity:
          type: primary
          name: business
      - name: entity_id
        data_type: integer
        tests: [not_null, unique]
      - name: entity_name
        data_type: varchar
      - name: principal_city
        data_type: varchar
      - name: principal_county
        data_type: varchar
      - name: principal_zip
        data_type: varchar
      - name: entity_type
        data_type: varchar
      - name: formation_date
        data_type: date
        description: "Date the business was registered with CDOS. Used as the semantic model time spine."
        granularity: day
        dimension:
          type: time
      - name: geo_key
        data_type: integer
      - name: crime_tier
        data_type: integer
      - name: income_tier
        data_type: integer
      - name: population_tier
        data_type: integer
      - name: composite_tier
        data_type: integer
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 4
      - name: qualifies_for_subsidy
        data_type: boolean
        tests: [not_null]
        dimension:
          type: categorical
      - name: subsidy_tier_label
        data_type: varchar
        tests: [not_null]
        dimension:
          type: categorical
      - name: notification_eligible
        data_type: boolean
        tests: [not_null]
        dimension:
          type: categorical
    metrics:
      - name: business_count
        type: simple
        label: "Business Count"
        description: "Count of Colorado businesses with an assigned B.A.S.E. tier, sliceable by tier/county/type."
        agg: count
        expr: business_key
      - name: avg_business_composite_tier
        type: simple
        label: "Avg Business Composite Tier"
        agg: average
        expr: composite_tier
      - name: subsidy_qualifying_business_count
        type: simple
        label: "Subsidy-Qualifying Business Count"
        description: "Count of businesses that qualify for a B.A.S.E. subsidy (composite_tier >= 3)."
        agg: sum_boolean
        expr: qualifies_for_subsidy
      - name: notification_eligible_business_count
        type: simple
        label: "Notification-Eligible Business Count"
        description: "Count of businesses eligible for automated OEDIT notification."
        agg: sum_boolean
        expr: notification_eligible
