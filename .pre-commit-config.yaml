exclude: |
  (?x)^(
    dbt-env/.*|
    \.venv/.*|
    venv/.*|
    \.astro/.*|
    logs/.*
  )$

repos:
  # ── General file hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']   # dbt YAML uses Jinja tags — unsafe allows them
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: no-commit-to-branch
        args: ['--branch', 'main']
      - id: check-merge-conflict

  # ── Python linting & formatting (Ruff) ─────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: ['--config', 'ruff.toml', '--fix']
      - id: ruff-format
        args: ['--config', 'ruff.toml']

  # NOTE: SQLFluff runs in the dbt-ci.yml CI pipeline where the full dbt
  # Snowflake adapter is available. It is intentionally excluded from
  # pre-commit because the hook's isolated environment cannot load the
  # dbt-snowflake adapter, which is required by the dbt templater.
